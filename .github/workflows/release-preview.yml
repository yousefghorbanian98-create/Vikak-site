name: Attach preview assets to release

# uploads.github.com is unreachable from some sandboxes, so the archives are
# published as release assets from GitHub Actions instead.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify archives
        run: |
          ls -lh preview/*.zip
          unzip -l preview/vikak-static-preview.zip | tail -2
          unzip -l preview/vikak-screenshots.zip | tail -2

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME:-v0.1.0-demo}"
          if [[ "$TAG" != v* ]]; then TAG="v0.1.0-demo"; fi
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "ویکک — پیش‌نمایش استاتیک" --notes "نسخه‌ی استاتیک کامل سایت (۵۸ صفحه) و اسکرین‌شات‌های ارائه — زیپ‌ها را دانلود کنید."
          gh release upload "$TAG" preview/vikak-static-preview.zip --clobber
          gh release upload "$TAG" preview/vikak-screenshots.zip --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'
