name: Attach static preview to release

# uploads.github.com is unreachable from some sandboxes, so the archive is
# published as a release asset from GitHub Actions instead.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify archive
        run: |
          ls -lh preview/vikak-static-preview.zip
          unzip -l preview/vikak-static-preview.zip | tail -2

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME:-v0.1.0-demo}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "ویکک — پیش‌نمایش استاتیک" --notes "نسخه‌ی استاتیک کامل سایت (۵۸ صفحه) — زیپ را دانلود و dist/index.html را باز کنید."
          gh release upload "$TAG" preview/vikak-static-preview.zip --clobber
